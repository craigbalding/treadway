name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: Contracts (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -e '.[dev]'
      - run: python .github/scripts/check_version.py
      - run: python -m ruff check --config src/treadway/robot-ruff.toml src tests .github/scripts
      - run: npm ci --ignore-scripts
      - name: Offline Python contracts
        run: env -u CHROME_BIN python -m pytest -q
      - if: matrix.python == '3.11'
        run: npm test

  browser-fast:
    name: Fast browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CHROME_BIN: /opt/google/chrome/chrome
      TREADWAY_CHROME_SANDBOX: 'on'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -e '.[dev]'
      - run: npm ci --ignore-scripts
      - name: Verify browser prerequisites
        run: |
          test -x "$CHROME_BIN"
          "$CHROME_BIN" --version
          python .github/scripts/check_browser.py
      - run: npm run test:browser:fast
      - name: Entra flow against synthetic HTTPS screens
        run: npm run test:entra:browser
      - name: Retain synthetic Entra failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: entra-browser-failure-diagnostics
          path: |
            ${{ runner.temp }}/treadway-entra-acceptance-*/**/events.jsonl
            ${{ runner.temp }}/treadway-entra-acceptance-*/**/receipt.json
            ${{ runner.temp }}/treadway-entra-acceptance-*/**/step-*.png
            ${{ runner.temp }}/treadway-entra-acceptance-*/**/output.json
            ${{ runner.temp }}/treadway-entra-acceptance-*/**/log.html
            ${{ runner.temp }}/treadway-widgets-*/failure.json
            ${{ runner.temp }}/treadway-widgets-*/failure.png
            ${{ runner.temp }}/treadway-widgets-*/**/chrome-*.log
          if-no-files-found: warn
          retention-days: 7

  recorder:
    name: Recorder contracts, extension and HTTP conversion
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
      - run: npm run test:recorder:logic
      - run: npx playwright install --with-deps chromium
      - name: Install matching Chromium sandbox helper
        # Downloaded Chromium is outside Ubuntu's AppArmor userns allowlist.
        # Install its matching helper in a root-owned location, keeping the
        # browser sandbox and system-wide namespace restrictions enabled.
        run: |
          sandbox_source=$(node -e 'const path = require("node:path"); console.log(path.join(path.dirname(require("playwright").chromium.executablePath()), "chrome_sandbox"))')
          test -x "$sandbox_source"
          sudo install -o root -g root -m 4755 "$sandbox_source" /usr/local/sbin/treadway-recorder-sandbox
          test -u /usr/local/sbin/treadway-recorder-sandbox
          test "$(stat -c '%u' /usr/local/sbin/treadway-recorder-sandbox)" = 0
      - name: Exercise the unpacked extension with the Chromium sandbox enabled
        env:
          RECORDER_REQUIRE_BROWSER: '1'
          CHROME_DEVEL_SANDBOX: /usr/local/sbin/treadway-recorder-sandbox
        run: npm run test:recorder:browser
      - run: python -m pip install -e '.[robot]'
      - run: python recorder/examples/http-first/walkthrough.py

  browserserve-service:
    name: Browserserve native reconnect
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Fetch pinned service and upstream sandbox profile
        run: |
          docker pull ghcr.io/browser-gateway/browserserve@sha256:c533e7b400e52802d08e53a6fa61f38b1f839d34cc0df10a3f56d3c48ae7251b
          python -c 'import os,pathlib,urllib.request; pathlib.Path(os.environ["RUNNER_TEMP"], "browserserve-seccomp.json").write_bytes(urllib.request.urlopen("https://raw.githubusercontent.com/browser-gateway/browserserve/132d98ada8481abd7014b6c8cc9f1779584c5586/docker/seccomp.json",timeout=30).read())'
      - name: Verify native provider against its shipped Chrome
        run: |
          python -m pip install '.[robot]'
          browser_root=$(python -c 'from pathlib import Path; import treadway; print(Path(treadway.__file__).parent / "browser")')
          npm ci --ignore-scripts --prefix "$browser_root"
          python scripts/test_browserserve_docker.py --seccomp "$RUNNER_TEMP/browserserve-seccomp.json" \
            --browser-root "$browser_root" --python-executable "$(command -v python)"
      - name: Retain synthetic service evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browserserve-native-evidence
          path: artifacts/browserserve-docker/*/ci-summary.json
          if-no-files-found: warn
          retention-days: 7

  distribution:
    name: Distribution and installed walkthroughs
    if: github.event_name != 'pull_request'
    needs: [contracts, browser-fast, recorder]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CHROME_BIN: /opt/google/chrome/chrome
      TREADWAY_CHROME_SANDBOX: 'on'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install build==1.3.0 twine==6.2.0
      - name: Validate version, including release tag
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python .github/scripts/check_version.py "$RELEASE_TAG"
          else
            python .github/scripts/check_version.py
          fi
      - name: Build source archive and wheel from that archive
        run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python .github/scripts/check_dist.py
      - run: npm ci --ignore-scripts
      - name: Install the exact wheel in a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/installed"
          "$RUNNER_TEMP/installed/bin/python" -m pip install "$(echo "$PWD"/dist/*.whl)[dev]"
      - name: Exercise the installed runtime and all three walkthroughs
        run: |
          export PATH="$RUNNER_TEMP/installed/bin:$PATH"
          bash .github/scripts/test_installed.sh
      - name: Retain local browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installed-browser-failure-diagnostics
          path: |
            ${{ runner.temp }}/treadway-installed.*/**/chrome-*.log
            ${{ runner.temp }}/treadway-installed.*/**/DevToolsActivePort
            ${{ runner.temp }}/treadway-installed.*/**/summary.json
            ${{ runner.temp }}/treadway-installed.*/**/browser-cleanup.json
            ${{ runner.temp }}/treadway-entra-acceptance-*/**/events.jsonl
            ${{ runner.temp }}/treadway-entra-acceptance-*/**/receipt.json
            ${{ runner.temp }}/treadway-entra-acceptance-*/**/step-*.png
            ${{ runner.temp }}/treadway-entra-acceptance-*/**/output.json
            ${{ runner.temp }}/treadway-entra-acceptance-*/**/log.html
            ${{ runner.temp }}/treadway-widgets-*/failure.json
            ${{ runner.temp }}/treadway-widgets-*/failure.png
            ${{ runner.temp }}/treadway-widgets-*/**/chrome-*.log
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [contracts, browser-fast, browserserve-service, distribution]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist
      - name: Publish the tested archives with checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          # An unfinished draft may be resumed; published versions are immutable.
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > releases.json
          draft=$(python3 -c 'import json,os; matches=[r for page in json.load(open("releases.json")) for r in page if r["tag_name"] == os.environ["RELEASE_TAG"]]; print("missing" if not matches else str(matches[0]["draft"]).lower())')
          case "$draft" in
            missing)
              gh release create "$RELEASE_TAG" --draft --verify-tag \
                --title "Treadway $RELEASE_TAG" --generate-notes
              ;;
            true) ;;
            *) echo 'Release is already published; use a new version.' >&2; exit 1 ;;
          esac
          gh release upload "$RELEASE_TAG" ./*.whl ./*.tar.gz SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --verify-tag
