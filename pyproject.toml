[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "treadway"
version = "0.2.0"
description = "Reliable workflow execution for agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/craigbalding/treadway"
Issues = "https://github.com/craigbalding/treadway/issues"

[project.optional-dependencies]
robot = ["robotframework==7.5.1"]
vault-rpa = ["rpaframework==34.0.1"]
dev = ["robotframework==7.5.1", "pytest>=8,<10", "ruff==0.14.8"]

[project.scripts]
treadway = "treadway.authoring:main"
treadway-preflight = "treadway.preflight:main"
treadway-browser = "treadway.browsers:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["treadway", "treadway.browser"]

[tool.setuptools.package-data]
treadway = ["browser/*.js", "browser/package*.json", "robot-ruff.toml",
  "authoring/project/*.py", "authoring/project/*.cjs", "authoring/project/*.js",
  "authoring/project/*.html", "authoring/project/*.robot", "authoring/project/*.md",
  "authoring/project/.gitignore", "authoring/project/tests/*.py",
  "authoring/project/*.json",
  "authoring/project/tests/*.cjs", "authoring/skill/treadway-flows/*.md",
  "authoring/skill/treadway-flows/references/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
