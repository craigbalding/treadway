<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Treadway reference workboard</title>
<style>body{font:16px system-ui;max-width:700px;margin:24px}label{display:block;margin:12px 0}input,button{font:inherit;padding:6px}#note{border:1px solid;min-height:60px;padding:8px}[role=option]{padding:8px;border:1px solid;cursor:pointer}#owner-results{background:#eee}#status{min-height:24px}</style></head>
<body><main id="application"><h1>Reference workboard</h1><p>Actor: <span id="actor"></span></p>

<section id="editor" hidden></section><p id="status" role="status"></p></main><script src="/app.js"></script></body></html>
